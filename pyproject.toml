[project]
name = "light-infinity-ai"
version = "0.1.0"
description = "AI Business Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "alembic>=1.13.0",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.9",
    "pydantic[email]>=2.6.0",
    "bcrypt>=4.0.1",
    # Corecție: Versiuni stabile reale prezente pe PyPI pentru a preveni blocarea instalării
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "streamlit>=1.35.0",
    "requests>=2.31.0",
    "agno>=2.7.3",
    "openai>=2.45.0",
    "groq>=1.5.0",
    "chromadb>=0.4.24",
    "psycopg2-binary>=2.9.9",
    "logfire[fastapi]>=1.4.0",
    "python-jose[cryptography]>=3.3.0",
    "pypdf>=4.0.0",
    "email-validator>=2.1.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.1",
    "stripe>=9.0.0",
    "reportlab>=4.1.0",
    "sendgrid>=6.11.0",
    "twilio>=9.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
# Corecție: Adăugat folderul global 'tests' pentru ca testul E2E webhook să fie detectat automat de Pytest
testpaths = [
    "tests",
    "app/modules/erp_production/tests",
    "app/modules/orders/tests"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
    # Recomandat pentru a suprima avertismentele de asincronism din TestClient
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
